    tier: 2
    role: main PL/EN extraction candidate
    repo: bartowski/Qwen_Qwen3.5-0.8B-GGUF
    file: "*Q4_K_M.gguf"
    revision: main
    license: Apache-2.0
    lang_pl: true
    verified: true
    notes: "No official Qwen GGUF for 3.5-0.8B found; bartowski quant of Qwen/Qwen3.5-0.8B (alternatives unsloth/Qwen3.5-0.8B-GGUF, lmstudio-community). Repo id confirmed via web search 2026-09-07 (huggingface.co blocked from the prep session, so the file list was not inspected; --verify still prints the real files before --all)."

