# Model shortlist for tools/download_models.py — PRD §10.1 / §10.2.
#
# `verified: true` = the repo id was confirmed (2026-09-07: SLM repos via web search, because
# huggingface.co is unreachable from the prep session; whisper.cpp files are the well-known
# ggml-*.bin names). It does NOT mean the file was hashed: `--all` lists the real files,
# takes the first match of `file` and writes cache/MANIFEST.md with sha256 (CLAUDE.md P0.4).
#
#     uv run python tools/download_models.py --verify        # lists real files per repo
#     uv run python tools/download_models.py --all           # downloads + writes MANIFEST.md
#
# Only entries with verified: true are downloaded by --all (--force-unverified overrides).
#
# Fields: name (local id), tier, role, repo, file (glob over repo files), revision (commit or
# "main"), license, lang_pl (model card claims Polish), verified, notes.

models:
  # ---- SLM cascade (GGUF Q4, llama.cpp) --------------------------------------------------
